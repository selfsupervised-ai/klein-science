[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Unshipped developer tooling: artifact store, host tools, guards and CI"

# No `[lints] workspace = true`: xtask is unshipped tooling and legitimately reads clocks,
# the environment and the process table, which the shipped-crate lints forbid.

[dependencies]
clap = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ksci-wire = { path = "../crates/ksci-wire" }
